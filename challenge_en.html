<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物質の分類チャレンジ / Substance Classification Challenge</title>
<meta property="og:title" content="物質の分類チャレンジ / Substance Classification Challenge">
<meta property="og:description" content="中2理科 化学変化と原子・分子｜物質を3階層で分類するインタラクティブ教材 (Bilingual JP/EN)">
<meta property="og:type" content="article">
<style>
  :root {
    --tan: #fff8e8;
    --line: #4a3a2a;
    --orange: #ff9a55;
    --orange-bg: #ffe9d4;
    --blue: #4ab4d6;
    --blue-bg: #d6eef6;
    --green: #6bbf7a;
    --green-bg: #dff2e1;
    --pink: #f4a8bd;
    --yellow: #ffd45c;
    --gray: #707070;
    --red: #e25555;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
    background: #f0e6d0;
    color: var(--line);
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }
  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px;
  }
  header.top {
    background: var(--tan);
    border: 3px solid var(--line);
    border-radius: 18px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header.top h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.04em;
  }
  header.top .badge {
    background: var(--line);
    color: var(--tan);
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
  }
  .mute-btn {
    font-size: 18px;
    padding: 4px 10px;
    border: 2px solid var(--line);
    background: white;
    border-radius: 999px;
    cursor: pointer;
    line-height: 1;
  }
  .mute-btn.off { background: #eee; opacity: 0.6; }
  .progress {
    margin-top: 12px;
    background: var(--tan);
    border: 3px solid var(--line);
    border-radius: 14px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress .step {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    border-radius: 10px;
    background: white;
    border: 2px solid #ddd;
    font-size: 12px;
    color: var(--gray);
    font-weight: bold;
    transition: 0.2s;
    cursor: pointer;
  }
  .progress .step.active {
    background: var(--yellow);
    border-color: var(--line);
    color: var(--line);
    transform: scale(1.05);
  }
  .progress .step.done {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .progress .step.done::before { content: "✔ "; }

  .card-stage {
    margin-top: 14px;
    background: var(--tan);
    border: 3px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    min-height: 540px;
    position: relative;
  }

  .stage-title {
    text-align: center;
    margin: 0 0 6px;
    font-size: 22px;
  }
  .stage-sub {
    text-align: center;
    margin: 0 0 14px;
    font-size: 14px;
    color: #666;
  }

  .help {
    background: #fffbe0;
    border: 2px dashed var(--line);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    text-align: center;
    color: #555;
    margin-bottom: 12px;
  }
  .help b { color: var(--line); }

  /* ----- 箱（dropzone） ----- */
  .boxes {
    display: grid;
    gap: 12px;
    margin-bottom: 12px;
  }
  .boxes.two   { grid-template-columns: 1fr 1fr; }
  .boxes.three { grid-template-columns: 1fr 1fr 1fr; }

  .box {
    background: white;
    border: 3px dashed var(--line);
    border-radius: 14px;
    padding: 10px;
    min-height: 130px;
    transition: 0.15s;
  }
  .box.over {
    background: #fff5b8;
    border-color: var(--yellow);
    border-style: solid;
    transform: scale(1.02);
  }
  .box h3 {
    margin: 0 0 8px;
    text-align: center;
    padding: 6px 0;
    border-radius: 8px;
    color: white;
    font-size: 16px;
  }
  .box.b-orange h3 { background: var(--orange); }
  .box.b-blue h3   { background: var(--blue); }
  .box.b-green h3  { background: var(--green); }
  .box.b-yellow h3 { background: #d4a83a; }
  .box.b-gray h3   { background: #888; }

  .box .slots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 80px;
    align-content: flex-start;
  }

  /* ----- 物質カード ----- */
  .pool {
    background: rgba(255,255,255,.6);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    min-height: 90px;
    transition: 0.15s;
  }
  .pool.over {
    background: #fff5b8;
    border-color: var(--yellow);
    transform: scale(1.01);
  }
  .pool .pool-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 6px;
    text-align: center;
  }
  .pool .slots {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    min-height: 60px;
  }

  .item {
    background: white;
    border: 2.5px solid var(--line);
    border-radius: 12px;
    padding: 6px 8px 4px;
    min-width: 88px;
    text-align: center;
    cursor: grab;
    transition: 0.15s;
    position: relative;
    touch-action: none;
  }
  .item:hover { transform: translateY(-2px); }
  .item.dragging {
    cursor: grabbing;
    opacity: 0.92;
    box-shadow: 0 10px 24px rgba(0,0,0,.3);
    transform: rotate(3deg) scale(1.05);
    pointer-events: none;
    z-index: 10000;
    transition: none;
  }
  .item.correct {
    border-color: var(--green);
    background: #d8f5dc;
    box-shadow: 0 0 0 2px var(--green);
  }
  .item.wrong {
    border-color: var(--red);
    background: #ffd9d9;
    box-shadow: 0 0 0 2px var(--red);
    animation: shake 0.3s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  .item .name {
    font-size: 11px;
    color: #555;
    margin-top: 2px;
  }
  .item .formula {
    font-size: 16px;
    font-weight: bold;
  }
  .item .formula sub { font-size: 12px; }

  /* ----- ボタン ----- */
  .actions {
    margin-top: 12px;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    padding: 10px 22px;
    border-radius: 999px;
    border: 3px solid var(--line);
    background: white;
    color: var(--line);
    cursor: pointer;
    transition: 0.15s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  button.primary { background: var(--yellow); }
  button.success {
    background: var(--green);
    color: white;
    border-color: var(--green);
    font-size: 16px;
    padding: 12px 28px;
  }
  button.ghost {
    background: transparent;
    font-size: 12px;
    padding: 6px 14px;
    border-width: 2px;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ----- 判定パネル ----- */
  .feedback {
    margin-top: 12px;
    padding: 10px 16px;
    border-radius: 12px;
    background: white;
    border: 2px solid var(--line);
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #f0fff2; border-color: var(--green); }
  .feedback.ng { background: #ffe9e9; border-color: var(--red); }

  /* ----- スタート / 結果 ----- */
  .center-screen {
    text-align: center;
    padding: 40px 20px;
  }
  .center-screen h2 {
    font-size: 30px;
    margin: 0 0 16px;
  }
  .center-screen p {
    font-size: 15px;
    line-height: 1.8;
    margin: 0 0 16px;
  }
  .score-display {
    font-size: 60px;
    font-weight: bold;
    color: var(--orange);
    margin: 16px 0;
  }
  .score-display small { font-size: 24px; color: var(--line); }

  /* ----- STEP4 クイズ ----- */
  .quiz {
    text-align: center;
  }
  .quiz .qnum {
    font-size: 13px;
    color: #666;
    margin-bottom: 6px;
  }
  .quiz .item-big {
    display: inline-block;
    background: white;
    border: 3px solid var(--line);
    border-radius: 16px;
    padding: 18px 26px;
    margin: 10px 0;
  }
  .quiz .item-big .formula {
    font-size: 36px;
    font-weight: bold;
  }
  .quiz .item-big .formula sub { font-size: 24px; }
  .quiz .item-big .name {
    font-size: 13px;
    color: #555;
    margin-top: 4px;
  }
  .quiz .choices {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .quiz .choice {
    font-size: 15px;
    padding: 12px 26px;
    border-radius: 14px;
    border: 3px solid var(--line);
    background: white;
    cursor: pointer;
    font-weight: bold;
    min-width: 130px;
    transition: 0.15s;
  }
  .quiz .choice:hover:not(:disabled) { transform: translateY(-2px); }
  .quiz .choice.c1 { background: var(--orange-bg); }
  .quiz .choice.c2 { background: var(--blue-bg); }
  .quiz .choice.c3 { background: var(--green-bg); }
  .quiz .choice.correct { background: var(--green); color: white; border-color: var(--green); }
  .quiz .choice.wrong { background: var(--red); color: white; border-color: var(--red); }
  .quiz .choice:disabled { cursor: not-allowed; transform: none; }

  /* ----- 4象限テーブル STEP3後の表示 ----- */
  .quad {
    margin-top: 12px;
    display: grid;
    grid-template-columns: 80px 1fr 1fr;
    gap: 4px;
    background: white;
    padding: 8px;
    border-radius: 12px;
    border: 2px solid var(--line);
    font-size: 12px;
  }
  .quad .head {
    background: var(--line);
    color: var(--tan);
    text-align: center;
    padding: 4px;
    border-radius: 6px;
    font-weight: bold;
  }
  .quad .label {
    background: #f5e9c8;
    text-align: center;
    padding: 8px 4px;
    border-radius: 6px;
    font-weight: bold;
  }
  .quad .cell {
    background: #fafafa;
    border-radius: 6px;
    padding: 6px;
    min-height: 52px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-content: center;
    justify-content: center;
  }

  /* キラキラ */
  @keyframes sparkle {
    0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
    100% { opacity: 0; transform: scale(0.5) rotate(360deg); }
  }
  .sparkle {
    position: fixed;
    pointer-events: none;
    font-size: 22px;
    animation: sparkle 0.8s ease-out forwards;
    z-index: 9999;
  }

  /* === 英訳併記スタイル === */
  .en {
    display: block;
    font-size: 0.7em;
    font-weight: normal;
    color: #888;
    font-style: italic;
    letter-spacing: 0.02em;
    margin-top: 1px;
    line-height: 1.3;
  }
  .en-inline {
    font-size: 0.78em;
    font-weight: normal;
    color: #888;
    font-style: italic;
    letter-spacing: 0.02em;
    margin-left: 4px;
  }
  header.top h1 .en, .stage-title .en {
    font-size: 0.55em;
    color: #999;
  }
  .progress .step .en { font-size: 0.85em; color: inherit; opacity: 0.65; margin-top: 0; }
  .item .name .en {
    font-size: 0.85em;
    color: #999;
    margin-top: 0;
  }
  .quiz .item-big .name .en {
    font-size: 0.7em;
    color: #999;
  }
  .box h3 .en {
    font-size: 0.65em;
    color: rgba(255,255,255,0.85);
  }
  .stage-sub .en {
    color: #888;
    font-size: 0.85em;
  }
  .help .en {
    font-size: 0.92em;
    color: #777;
    margin-top: 2px;
  }
  button .en {
    font-size: 0.78em;
    color: inherit;
    opacity: 0.75;
    display: inline;
    margin-left: 4px;
  }

  @media (max-width: 720px) {
    .boxes.two   { grid-template-columns: 1fr; }
    .boxes.three { grid-template-columns: 1fr; }
    .quad { grid-template-columns: 60px 1fr 1fr; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>物質の分類チャレンジ<span class="en">Substance Classification Challenge</span></h1>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="mute-btn" id="muteBtn" onclick="toggleSound()" title="音のON / OFF">🔊</button>
      <span class="badge">中2 理科｜化学変化と原子・分子<span class="en">Grade 8 Science | Chemical Change</span></span>
    </div>
  </header>

  <div class="progress" id="progress">
    <div class="step" data-step="0">スタート<span class="en">Start</span></div>
    <div class="step" data-step="1">①混合物か純物質か<span class="en">Mixture / Pure</span></div>
    <div class="step" data-step="2">②単体か化合物か<span class="en">Element / Compound</span></div>
    <div class="step" data-step="3">③分子か分子でないか<span class="en">Molecule or Not</span></div>
    <div class="step" data-step="4">④総合クイズ<span class="en">Quiz</span></div>
    <div class="step" data-step="5">⑤発展問題<span class="en">Bonus</span></div>
  </div>

  <div class="card-stage" id="stage"></div>
</div>

<script>
/* =========================================================
   物質データ
   ========================================================= */
const SUBSTANCES = {
  O2:    { formula: 'O<sub>2</sub>',  name: '酸素 / Oxygen',         pure: true,  type: '単体',   molecule: true  },
  H2:    { formula: 'H<sub>2</sub>',  name: '水素 / Hydrogen',         pure: true,  type: '単体',   molecule: true  },
  Cu:    { formula: 'Cu',             name: '銅 / Copper',           pure: true,  type: '単体',   molecule: false },
  Mg:    { formula: 'Mg',             name: 'マグネシウム / Magnesium', pure: true,  type: '単体',   molecule: false },
  Fe:    { formula: 'Fe',             name: '鉄 / Iron',           pure: true,  type: '単体',   molecule: false },
  H2O:   { formula: 'H<sub>2</sub>O', name: '水 / Water',           pure: true,  type: '化合物', molecule: true  },
  CO2:   { formula: 'CO<sub>2</sub>', name: '二酸化炭素 / Carbon dioxide',   pure: true,  type: '化合物', molecule: true  },
  NaCl:  { formula: 'NaCl',           name: '塩化ナトリウム / Sodium chloride', pure: true, type: '化合物', molecule: false },
  CuO:   { formula: 'CuO',            name: '酸化銅 / Copper oxide',       pure: true,  type: '化合物', molecule: false },
  Saltwater: { formula: '食塩水<span class="en">Saltwater</span>',      name: 'NaCl + H₂O (Salt water)',     pure: false, type: '混合物' },
  Air:       { formula: '空気<span class="en">Air</span>',        name: 'N₂・O₂・… (Air mix)',      pure: false, type: '混合物' },
  Tea:       { formula: 'お茶<span class="en">Tea</span>',        name: '水＋茶の成分 / Water + Tea',   pure: false, type: '混合物' },
  Seawater:  { formula: '海水<span class="en">Seawater</span>',        name: '水＋塩など / Water + Salt',     pure: false, type: '混合物' },

  /* ⑤発展問題用 */
  Ag:        { formula: 'Ag',          name: '銀 / Silver',             pure: true,  type: '単体' },
  C:         { formula: 'C',           name: '炭素 / Carbon',           pure: true,  type: '単体' },
  N2:        { formula: 'N<sub>2</sub>', name: '窒素 / Nitrogen',         pure: true,  type: '単体' },
  Zn:        { formula: 'Zn',          name: '亜鉛 / Zinc',           pure: true,  type: '単体' },
  Au:        { formula: 'Au',          name: '金 / Gold',             pure: true,  type: '単体' },
  NH4_2SO4:  { formula: '(NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub>', name: '硫酸アンモニウム / Ammonium sulfate', pure: true, type: '化合物' },
  C6H12O6:   { formula: 'C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>',   name: 'でんぷん / Starch',         pure: true, type: '化合物' },
  C2H5OH:    { formula: 'C<sub>2</sub>H<sub>5</sub>OH', name: 'エタノール / Ethanol',     pure: true,  type: '化合物' },
  Ag2O:      { formula: 'Ag<sub>2</sub>O', name: '酸化銀 / Silver oxide',     pure: true,  type: '化合物' },
  NH3:       { formula: 'NH<sub>3</sub>',  name: 'アンモニア / Ammonia', pure: true,  type: '化合物' },
  CuS:       { formula: 'CuS',         name: '硫化銅 / Copper sulfide',         pure: true,  type: '化合物' },
  CH3COOH:   { formula: 'CH<sub>3</sub>COOH', name: '酢酸 / Acetic acid',    pure: true,  type: '化合物' },
  Cola:      { formula: 'コーラ<span class="en">Cola</span>',      name: '糖・水・… (Cola mix)',      pure: false, type: '混合物' },
  NaClAq:    { formula: '塩化Na水溶液<span class="en">NaCl aq.</span>', name: 'NaCl + H₂O / Sodium chloride solution', pure: false, type: '混合物' },
  CuCl2Aq:   { formula: '塩化Cu水溶液<span class="en">CuCl₂ aq.</span>', name: 'CuCl₂ + H₂O / Copper chloride solution',   pure: false, type: '混合物' },
};

/* =========================================================
   状態
   ========================================================= */
const state = {
  step: 0,
  scores: { 1: null, 2: null, 3: null, 4: null, 5: null },
  step1Items: ['O2','H2O','Saltwater','CO2','Air','Tea'],     // 純3 / 混3
  step2Items: ['O2','H2O','Cu','CO2','NaCl','H2','CuO','Mg'],
  step3Items: ['O2','H2','H2O','CO2','Cu','Mg','NaCl','CuO'],
  step4Pool:  ['O2','H2','Cu','Mg','Fe','H2O','CO2','NaCl','CuO','Saltwater','Air','Tea','Seawater'],
  step5Items: [
    'H2','Ag','NH4_2SO4','C','H2O','NaCl',
    'C6H12O6','N2','Zn','C2H5OH','Mg','Cu',
    'Ag2O','NaClAq','Air','Au','NH3','CuS',
    'CH3COOH','Cola','CuCl2Aq','CO2','O2','Fe'
  ],
};

/* =========================================================
   ユーティリティ
   ========================================================= */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeItem(key) {
  const s = SUBSTANCES[key];
  const div = document.createElement('div');
  div.className = 'item';
  div.dataset.key = key;
  div.innerHTML = `<div class="formula">${s.formula}</div><div class="name">${s.name}</div>`;
  attachDrag(div);
  return div;
}

function sparkle(x, y) {
  const marks = ['✨','⭐','🌟','💫'];
  for (let i = 0; i < 5; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = marks[Math.floor(Math.random() * marks.length)];
    el.style.left = (x + (Math.random() - 0.5) * 80) + 'px';
    el.style.top  = (y + (Math.random() - 0.5) * 80) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
}

function updateProgress() {
  $$('#progress .step').forEach(el => {
    const s = +el.dataset.step;
    el.classList.toggle('active', s === state.step);
    el.classList.toggle('done', s < state.step && s !== 0);
  });
}

/* =========================================================
   音（Web Audio API）
   ========================================================= */
let audioCtx = null;
let soundOn = true;

function getAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playCorrect() {
  if (!soundOn) return;
  const ctx = getAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  // ド・ミ・ソ の上昇アルペジオ
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    osc.type = 'sine';
    const t = now + i * 0.08;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.34);
  });
}

function playWrong() {
  if (!soundOn) return;
  const ctx = getAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  // ブッブッ（低めのsquare 2発）
  [0, 0.18].forEach((delay) => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 180;
    osc.type = 'square';
    const t = now + delay;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.15);
  });
}

function playPick() {
  if (!soundOn) return;
  const ctx = getAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  // ピッ（高めの短い音）
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = 880;
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.07, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.1);
}

function playDrop() {
  if (!soundOn) return;
  const ctx = getAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  // コトッ（落ちる感じ、440 → 330 へ下降）
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.setValueAtTime(440, now);
  osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
  osc.type = 'sine';
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.09, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.14);
}

function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('muteBtn');
  if (btn) {
    btn.textContent = soundOn ? '🔊' : '🔇';
    btn.classList.toggle('off', !soundOn);
  }
  if (soundOn) playCorrect(); // ON時に確認音
}

/* =========================================================
   ドラッグ&ドロップ（Pointer Events）
   ========================================================= */
function attachDrag(item) {
  item.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return; // 左クリックのみ
    e.preventDefault();

    const pointerId = e.pointerId;
    const rect = item.getBoundingClientRect();
    const startX = e.clientX;
    const startY = e.clientY;
    const offsetX = startX - rect.left;
    const offsetY = startY - rect.top;
    const origParent = item.parentNode;
    const origNext = item.nextSibling;

    let dragging = false;
    let lastTarget = null;

    const startDrag = () => {
      dragging = true;
      playPick();
      // 採点クラスを外す（動かしたら結果はリセット）
      item.classList.remove('correct', 'wrong');
      item.classList.add('dragging');
      // body 直下に置いてfixedで動かす
      item.style.position = 'fixed';
      item.style.width = rect.width + 'px';
      item.style.left = (startX - offsetX) + 'px';
      item.style.top  = (startY - offsetY) + 'px';
      document.body.appendChild(item);
    };

    const onMove = (ev) => {
      if (ev.pointerId !== pointerId) return;
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      if (!dragging) {
        if (Math.abs(dx) + Math.abs(dy) > 4) {
          startDrag();
        } else {
          return;
        }
      }
      item.style.left = (ev.clientX - offsetX) + 'px';
      item.style.top  = (ev.clientY - offsetY) + 'px';

      const below = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = below ? below.closest('.box, .pool') : null;
      if (target !== lastTarget) {
        $$('.box.over, .pool.over').forEach(el => el.classList.remove('over'));
        if (target) target.classList.add('over');
        lastTarget = target;
      }
    };

    const cleanup = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    };

    const onUp = (ev) => {
      if (ev.pointerId !== pointerId) return;
      cleanup();
      if (!dragging) return; // クリックだけ → 何もしない（元の位置のまま）

      const below = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = below ? below.closest('.box, .pool') : null;

      // 浮かせていたスタイルをリセット
      item.style.position = '';
      item.style.left = '';
      item.style.top = '';
      item.style.width = '';
      item.classList.remove('dragging');

      if (target) {
        target.querySelector('.slots').appendChild(item);
        playDrop();
      } else {
        // 元の位置に戻す
        if (origNext && origNext.parentNode === origParent) {
          origParent.insertBefore(item, origNext);
        } else {
          origParent.appendChild(item);
        }
      }
      $$('.box.over, .pool.over').forEach(el => el.classList.remove('over'));

      // 触ったらフィードバック・結果ボタンはクリア
      const fb = $('#stage .feedback');
      if (fb && fb.classList.contains('show')) {
        // 不正解フィードバック中の操作は維持。正解済みは触らせない流れ
      }
    };

    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

        <h3>単体<span class="en">Element</span></h3>
        <div class="slots"></div>
      </div>
      <div class="box b-blue" data-correct="化合物">
        <h3>化合物<span class="en">Compound</span></h3>
        <div class="slots"></div>
      </div>
      <div class="box b-green" data-correct="混合物">
        <h3>混合物<span class="en">Mixture</span></h3>
        <div class="slots"></div>
      </div>
    </div>
    <div class="pool">
      <div class="pool-label">▼ 24種類の物質たち（戻したいときもここへドラッグ） ▼<span class="en">24 substances (drag here to return)</span></div>
      <div class="slots" id="pool5"></div>
    </div>
    <div class="actions"></div>
    <div class="feedback"></div>
  `;
  const pool = $('#pool5');
  shuffle(state.step5Items).forEach(k => pool.appendChild(makeItem(k)));
  rebuildActions(5);
}

function checkStep5() {
  if (!allPlaced('pool5')) {
    showFb('まだ箱に入っていない物質があるよ', false);
    playWrong();
    return;
  }
  let correct = 0, total = 0;
  $$('#stage .box').forEach(box => {
    const expect = box.dataset.correct;
    $$('.item', box).forEach(it => {
      total++;
      const s = SUBSTANCES[it.dataset.key];
      const isCorrect = s.type === expect;
      it.classList.toggle('correct', isCorrect);
      it.classList.toggle('wrong', !isCorrect);
      if (isCorrect) correct++;
    });
  });
  state.scores[5] = { correct, total };
  if (correct === total) {
    showFb(
      `🏆 パーフェクト！分類マスター認定！ / 🏆 Perfect! Classification Master!<br>
       3階層の分類がしっかり身についているね。<span class="en">You've mastered the 3-level classification.</span>
       「水溶液」「コーラ」「空気」など、化学式で書かれていないものが混合物だったよ。<span class="en">"Solution", "cola", "air" without a formula → mixtures.</span>`, true);
    sparkle(window.innerWidth/2, 200);
    setTimeout(() => sparkle(window.innerWidth/2, 250), 300);
    setTimeout(() => sparkle(window.innerWidth/2, 200), 600);
    showFinalBtns();
  } else {
    showFb(
      `${correct} / ${total} 問正解。<br>
       <b style="color:var(--red);">赤いカード</b>を見直そう。<span class="en">Check the red cards.</span>
       「〜水溶液」「コーラ」「空気」のように化学式で表せないものは<b>混合物</b>だよ。<span class="en">Things without a chemical formula like "solution", "cola", "air" are mixtures.</span>`, false);
    showRetryBtns('pool5');
  }
}

function showFinalBtns() {
  playCorrect();
  const actions = $('#stage .actions');
  actions.innerHTML = `
    <button class="success" onclick="goStep(0)">最初から <span class="en-inline">Restart</span></button>
    <button class="ghost" onclick="goStep(4)">クイズに戻る <span class="en-inline">Back to Quiz</span></button>
  `;
}

/* =========================================================
   結果
   ========================================================= */
function renderResult() {
  state.step = 4;
  updateProgress();
  const q = state.quiz;
  const total = q.items.length;
  const pct = Math.round(q.correct / total * 100);
  let comment = '';
  if (pct === 100) comment = 'パーフェクト！分類マスターだね 🏆 / Perfect! Classification Master 🏆';
  else if (pct >= 80) comment = 'すばらしい！ほぼ完ぺき 👏 / Excellent! Almost perfect 👏';
  else if (pct >= 60) comment = 'いい感じ！もう一歩でマスター 💪 / Nice! Almost there 💪';
  else comment = '教科書を見ながらもう一度やってみよう 📖 / Try again with your textbook 📖';
  $('#stage').innerHTML = `
    <div class="center-screen">
      <h2>けっか発表！<span class="en">Results!</span></h2>
      <div class="score-display">${q.correct}<small> / ${total}</small></div>
      <p>${comment}</p>
      <div style="margin-top:12px; font-size:13px; color:#666;">
        STEP1: ${state.scores[1] ? state.scores[1].correct + '/' + state.scores[1].total : '-'}
        STEP2: ${state.scores[2] ? state.scores[2].correct + '/' + state.scores[2].total : '-'}
        STEP3: ${state.scores[3] ? state.scores[3].correct + '/' + state.scores[3].total : '-'}
      </div>
      <div style="margin-top:18px;">
        <button class="success" onclick="goStep(5)">⑤ 発展問題に挑戦 ▶ <span class="en-inline">Try Bonus</span></button>
      </div>
      <div style="margin-top:10px;">
        <button class="primary" onclick="goStep(4)">クイズだけもう一回 <span class="en-inline">Retry Quiz</span></button>
        <button class="ghost" onclick="goStep(0)">最初から</button>
      </div>
    </div>
  `;
  if (pct === 100) {
    setTimeout(() => sparkle(window.innerWidth/2, 200), 100);
    setTimeout(() => sparkle(window.innerWidth/2, 250), 400);
    setTimeout(() => sparkle(window.innerWidth/2, 200), 700);
  }
}

/* =========================================================
   フィードバック表示・進行ボタン
   ========================================================= */
function showFb(html, ok) {
  const fb = $('#stage .feedback');
  fb.classList.add('show');
  fb.classList.toggle('ok', ok);
  fb.classList.toggle('ng', !ok);
  fb.innerHTML = html;
}

function showNextBtn(callback, label) {
  playCorrect();
  const actions = $('#stage .actions');
  actions.innerHTML = `
    <button class="success" id="nextBtn">${label} ▶</button>
    <button class="ghost" onclick="resetAll()">最初からやり直す <span class="en-inline">Restart</span></button>
  `;
  $('#nextBtn').onclick = callback;
}

function showRetryBtns(poolId) {
  playWrong();
  const actions = $('#stage .actions');
  const checkFn = `checkStep${state.step}()`;
  actions.innerHTML = `
    <button class="primary" onclick="returnWrong('${poolId}')">まちがいだけ戻す <span class="en-inline">Return wrong</span></button>
    <button class="primary" onclick="${checkFn}">もう一度 答え合わせ <span class="en-inline">Check again</span></button>
    <button class="ghost" onclick="resetAll()">全部やり直す</button>
  `;
}

function goStep(n) {
  if (n === 0) renderStart();
  else if (n === 1) renderStep1();
  else if (n === 2) renderStep2();
  else if (n === 3) renderStep3();
  else if (n === 4) renderStep4();
  else if (n === 5) renderStep5();
}

// 進捗バーから直接ジャンプ
$$('#progress .step').forEach(el => {
  el.addEventListener('click', () => {
    const s = +el.dataset.step;
    goStep(s);
  });
});

renderStart();
</script>
</body>
</html>
